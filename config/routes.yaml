domain:
    resource: '../src/Domain/Controller'
    type: attribute

computer:
    resource: '../src/Computer/Controller'
    type: attribute

multiplayer:
    resource: '../src/Multiplayer/Controller'
    type: attribute

outgoing_api:
    resource: '../src/OutgoingApi/Controller'
    type: attribute
    defaults:
        # Adds "_outgoing_api" to the list of attributes for every endpoint inside OutgoingApi module
        # so endpoints can be recognized as belonging to OutgoingApi module
        _outgoing_api: true

security:
    resource: '../src/Security/Controller'
    type: attribute

shared:
    resource: '../src/Shared/Controller'
    type: attribute

admin:
    resource: '../src/Admin/Controller'
    type: attribute

account:
    resource: '../src/Account/Controller'
    type: attribute

nelmio_api_doc:
    documentation:
        info:
            title: F1Simulator
            description: F1Simulator
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    description: 'API token generated on the account page (/account/api-token/index).'
        security:
            - Bearer: []
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
